name: CI Build Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        env:
          # Pywlet runs in the browser via onnxruntime-web; skip unused Linux CUDA binaries
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm install

      - name: Typecheck and build
        env:
          VITE_BASE_PATH: /pywlet/
        run: npm run build
