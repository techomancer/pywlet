<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a2436" />
      <stop offset="100%" stop-color="#0f141c" />
    </linearGradient>
    <linearGradient id="pyBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#2563eb" />
    </linearGradient>
    <linearGradient id="pyGreen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#16a34a" />
    </linearGradient>
    <linearGradient id="accentGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
  </defs>

  <!-- Rounded app tile background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  <rect x="20" y="20" width="472" height="472" rx="96" fill="none" stroke="#2b384e" stroke-width="8" />

  <!-- Subtle glowing badge ring -->
  <circle cx="256" cy="256" r="172" fill="#161d29" stroke="#2b384e" stroke-width="6" />

  <!-- Friendly stylized owl / code-tutor silhouette -->
  <!-- Ear tufts -->
  <path d="M162 152 L198 184 L154 206 Z" fill="url(#pyBlue)" />
  <path d="M350 152 L314 184 L358 206 Z" fill="url(#pyBlue)" />

  <!-- Owl head & body -->
  <rect x="148" y="168" width="216" height="202" rx="92" fill="url(#pyBlue)" />

  <!-- Belly / pygame screen chest -->
  <rect x="184" y="266" width="144" height="84" rx="36" fill="#0f141c" stroke="#38bdf8" stroke-width="5" />

  <!-- Code prompt & green play pixel icon on chest -->
  <path d="M216 293 L236 308 L216 323" fill="none" stroke="url(#pyGreen)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="248" y="316" width="46" height="11" rx="5.5" fill="url(#accentGold)" />

  <!-- Big friendly owl eyes -->
  <circle cx="212" cy="224" r="34" fill="#e6edf7" />
  <circle cx="300" cy="224" r="34" fill="#e6edf7" />
  <circle cx="216" cy="224" r="17" fill="#0f141c" />
  <circle cx="296" cy="224" r="17" fill="#0f141c" />
  <circle cx="222" cy="216" r="6" fill="#ffffff" />
  <circle cx="302" cy="216" r="6" fill="#ffffff" />

  <!-- Beak -->
  <path d="M242 246 L270 246 L256 268 Z" fill="url(#accentGold)" />

  <!-- Sparkle star -->
  <path d="M376 112 L383 131 L402 138 L383 145 L376 164 L369 145 L350 138 L369 131 Z" fill="url(#accentGold)" />
</svg>
